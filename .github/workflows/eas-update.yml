# Publica una actualización OTA (JavaScript y assets) sin recompilar el APK.
#
# - Push a `main`  -> canal `preview` mientras el producto está en desarrollo.
# - Ejecución manual -> permite elegir `preview` o `production`.
#
# Cuando el producto salga, el push a `main` pasa a `production` y los teléfonos
# de los usuarios reciben las mejoras. Ver `docs/context/estado.md`.
#
# Requiere el secreto `EXPO_TOKEN` en el repositorio: un token de acceso de
# expo.dev con permiso sobre el proyecto. Sin él, el paso de publicación falla
# con un mensaje claro y no se publica nada.
#
# Lo nativo (SDK, permisos, librerías con código nativo, icono) no viaja acá:
# eso exige un build de EAS. Ver `docs/context/estado.md`.
name: Actualizacion OTA

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      channel:
        description: Canal de EAS Update
        type: choice
        options:
          - preview
          - production
        default: preview

concurrency:
  group: eas-update-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publicar:
    name: Verificar y publicar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      CANAL: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'preview' }}
    steps:
      - name: Traer el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Formato, lint, tipos y pruebas
        run: npm run check

      - name: Publicar la actualización
        run: |
          npx eas-cli@latest update \
            --channel "$CANAL" \
            --auto \
            --non-interactive
